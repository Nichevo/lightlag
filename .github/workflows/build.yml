# Builds and tests every push and pull request. On main it also exports the Windows game and
# publishes it as a GitHub release, which tools/UpdateAndPlay.ps1 downloads.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  scripts:
    # The launcher scripts run on Windows; check they at least parse there.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; $errors | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 }
      - name: Update and Play dry run (no release yet is fine)
        shell: powershell
        run: |
          & tools\UpdateAndPlay.ps1 -NoLaunch -InstallDir "$env:RUNNER_TEMP\play"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { Write-Host "Updater exited $LASTEXITCODE" }

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test the simulation
        run: dotnet test Lightlag.sln -c Release

      - name: Headless batch (20 games, strict rule checks)
        run: dotnet run --project src/Lightlag.Headless -c Release -- batch --games 20 --days 365 --seed 1 --data-dir ci-data

      - name: Work out the version
        id: version
        run: |
          VERSION="0.0.${{ github.run_number }}"
          COMMIT="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          printf '{ "version": "%s", "commit": "%s", "builtAt": "%s" }\n' "$VERSION" "$COMMIT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > game/build_info.json
          cat game/build_info.json

      - name: Install Godot ${{ env.GODOT_VERSION }} (.NET)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d godot
          mv godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64 godot/app
          ln -s "$PWD/godot/app/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" godot/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$tdir/"
          godot/godot --version

      - name: Import and build the game
        run: |
          godot/godot --headless --path game --import || true
          godot/godot --headless --path game --build-solutions --quit

      - name: Smoke test the game (Linux, headless)
        run: |
          godot/godot --headless --path game -- --smoke-test --data-dir="$PWD/smoke-data" | tee smoke.log
          grep -q "SMOKE TEST PASSED" smoke.log

      - name: Screenshots of the map (virtual screen)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1600x900x24" godot/godot --path game --rendering-driver opengl3 \
            --rendering-method gl_compatibility --resolution 1600x900 -- --screenshots="$PWD/screenshots" \
            --data-dir="$PWD/shot-data" | tee shots.log
          grep -q "SCREENSHOTS DONE" shots.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # Also keep the latest screenshots on a "screenshots" branch, where they are easy to fetch and view.
      - name: Publish screenshots to the screenshots branch
        if: always() && hashFiles('screenshots/*.png') != ''
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "lightlag-ci"
          git config user.email "lightlag-ci@users.noreply.github.com"
          git add . && git commit -qm "Map screenshots for ${SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screenshots

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot/godot --headless --path game --export-release "Windows Desktop" ../build/windows/Lightlag.exe
          test -f build/windows/Lightlag.exe

      - name: Add the headless runner and tools
        run: |
          dotnet publish src/Lightlag.Headless -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/windows/headless
          cp game/build_info.json build/windows/
          cp game/build_info.json build/windows/headless/
          cp tools/*.ps1 tools/*.cmd build/windows/
          cd build/windows && zip -qr "../Lightlag-${{ steps.version.outputs.version }}-windows.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Lightlag-${{ steps.version.outputs.version }}-windows
          path: build/Lightlag-*-windows.zip
          retention-days: 14

      - name: Upload test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            ci-data/
            smoke-data/
          if-no-files-found: ignore

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lightlag ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/Lightlag-*-windows.zip
          body: |
            Automatic build of ${{ steps.version.outputs.commit }}.
            Use "Update and Play" to install it; the previous build is kept for rollback.
